[project]
name = "sca-tg"
version = "0.1.0"
description = "Profiling side-channel analysis: varying leakage models and training trace selection (PyTorch)"
authors = [
    { name = "Sengim" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
